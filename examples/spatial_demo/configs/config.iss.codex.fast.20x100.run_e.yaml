# ISS 20-agent / 100-step Run E nudge-only conversation generation with fast GPT/Codex.

llm:
  provider: "command"
  model: "codex-cli:gpt-5.3-codex-spark"
  command:
    - "./scripts/run_codex_prompt.sh"
  prompt_mode: "stdin"
  response_format: "text"
  timeout_seconds: 300
  max_retries: 1
  retry_backoff_seconds: 2
  env:
    CODEX_MODEL: "gpt-5.3-codex-spark"
    CODEX_REASONING_EFFORT: "low"
    CODEX_SANDBOX: "read-only"
    CODEX_IGNORE_USER_CONFIG: "true"
